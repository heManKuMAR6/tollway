[package]
name = "tollway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small, self-hosted gateway that keeps AI agents running when providers fail."
license = "MIT"
repository = "https://github.com/heManKuMAR6/tollway"
readme = "README.md"
keywords = ["llm", "gateway", "failover", "agents", "proxy"]
categories = ["web-programming::http-server"]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tokio = { version = "1.53.3", features = ["sync", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
